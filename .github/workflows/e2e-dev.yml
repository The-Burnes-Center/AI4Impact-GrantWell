name: E2E (dev)

# Playwright drives the deployed dev site (grantwell-burnes-staging) through the journeys in e2e/.
# Reusable: the dev deploy runs it after deploying, and the nightly runs it on a schedule.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to take the suite from. Empty means the ref that triggered the run.
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to take the suite from. Empty means the chosen branch.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: E2E journeys
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One test account: two runs must never overlap, so a deploy's run and the nightly queue.
    concurrency:
      group: e2e-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Can only read the Turnstile bypass parameter; the suite gets everything else from the site.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.E2E_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-grantwell-dev-e2e
          aws-region: us-east-1

      - name: Run journeys
        run: npx playwright test
        env:
          E2E_USER_EMAIL: e2e-dev@grantwell.invalid
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_TOTP_SECRET }}

      # The login journey runs untraced, so these hold no password or bypass token; any refresh
      # token in them was revoked by the suite's teardown.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
