name: Deploy to GrantWell

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-grantwell-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      MFA_REQUIRED: "false"
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      ENVIRONMENT: grantwell-staging
      GRANTWELL_INSTANCE: generic
      STACK_NAME: grantwell-staging
      CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.CLOUDFRONT_CERTIFICATE_ARN_STAGING }}
      CLOUDFRONT_CUSTOM_DOMAIN: ${{ secrets.CLOUDFRONT_CUSTOM_DOMAIN_STAGING }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN_GRANTWELL_STAGING }}
          role-session-name: ${{ github.actor }}-grantwell
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/ui/package-lock.json

      - name: Install backend dependencies
        working-directory: packages/core
        run: npm ci

      - name: Deploy CDK stacks to GrantWell staging
        working-directory: packages/core
        run: |
          npx cdk deploy ${{ env.STACK_NAME }} --require-approval never
