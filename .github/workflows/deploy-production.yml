name: Deploy to GrantWell

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-grantwell-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      ENVIRONMENT: grantwell-staging
      GRANTWELL_INSTANCE: generic
      STACK_NAME: grantwell-staging
      CLOUDFRONT_CERTIFICATE_ARN: ${{ secrets.CLOUDFRONT_CERTIFICATE_ARN_STAGING }}
      CLOUDFRONT_CUSTOM_DOMAIN: ${{ secrets.CLOUDFRONT_CUSTOM_DOMAIN_STAGING }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN_GRANTWELL_STAGING }}
          role-session-name: ${{ github.actor }}-grantwell
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd lib/user-interface/app
          npm install --legacy-peer-deps
          npm install -g aws-cdk

      - name: Bootstrap AWS environment
        run: cdk bootstrap

      # TEMPORARY: the app stack still imports the DraftTable stream ARN that this branch no
      # longer exports, and CloudFormation will not delete an export while it is imported. The
      # --exclusively pass drops the import first so the table stack can then drop the export.
      # Revert to the single deploy once this has run.
      - name: Deploy CDK stacks to Production
        run: |
          cdk deploy ${{ env.STACK_NAME }} --exclusively --require-approval never
          cdk deploy ${{ env.STACK_NAME }} --require-approval never
