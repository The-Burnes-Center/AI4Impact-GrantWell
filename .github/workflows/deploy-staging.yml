name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      MFA_REQUIRED: "false"
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      ENVIRONMENT: grantwell-burnes-staging
      GRANTWELL_INSTANCE: generic
      STACK_NAME: grantwell-burnes-staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN_BURNES_STAGING }}
          role-session-name: ${{ github.actor }}-grantwell-burnes-staging
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/ui/package-lock.json

      - name: Install backend dependencies
        working-directory: packages/core
        run: npm ci

      - name: Check for off-palette colors (warn only)
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          cd packages/ui
          npm run lint:colors -- --base origin/main --warn

      - name: Deploy CDK stacks to staging
        working-directory: packages/core
        run: |
          npx cdk deploy ${{ env.STACK_NAME }} --require-approval never