name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      GRANTWELL_INSTANCE: generic

    defaults:
      run:
        working-directory: lib/user-interface/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Lint (fails on errors, including jsx-a11y/strict)
        run: npm run lint

      - name: Component accessibility tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Page-level accessibility scan (unauthenticated states)
        run: npm run test:a11y

      - name: Upload accessibility report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-staging
          path: lib/user-interface/app/playwright-report/
          retention-days: 14

  deploy:
    runs-on: ubuntu-latest
    needs: quality

    env:
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      ENVIRONMENT: grantwell-burnes-staging
      GRANTWELL_INSTANCE: generic
      STACK_NAME: grantwell-burnes-staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN_BURNES_STAGING }}
          role-session-name: ${{ github.actor }}-grantwell-burnes-staging
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install

      - name: Install frontend dependencies
        run: |
          cd lib/user-interface/app
          npm install --legacy-peer-deps
          npm install -g aws-cdk

      - name: Bootstrap AWS environment
        run: cdk bootstrap

      - name: Deploy CDK stacks to staging
        run: |
          cdk deploy ${{ env.STACK_NAME }} --require-approval never