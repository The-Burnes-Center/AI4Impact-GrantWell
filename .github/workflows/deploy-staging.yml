name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Dev runs this commit's source: Generic's config with vendor/ packed in the runner, never committed.
  deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      ENVIRONMENT: grantwell-burnes-staging
      STACK_NAME: grantwell-burnes-staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.SERVICE_ROLE_ARN_BURNES_STAGING }}
          role-session-name: ${{ github.actor }}-grantwell-burnes-staging
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/ui/package-lock.json
            instances/generic/package-lock.json

      - name: Check for off-palette colors (warn only)
        run: |
          git fetch --depth=1 origin main:refs/remotes/origin/main
          cd packages/ui
          npm run lint:colors -- --base origin/main --warn

      - name: Build Generic from source (build/generic)
        run: scripts/pack.sh --dev

      - name: Deploy CDK stacks to staging
        working-directory: build/generic
        run: |
          npx cdk deploy ${{ env.STACK_NAME }} --require-approval never

  e2e:
    needs: deploy
    uses: ./.github/workflows/e2e-dev.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # What prod would get from this commit, diffed against live prod. The role can only read the prod
  # stacks' CloudFormation templates and can't assume the CDK deploy role, so this job can't deploy.
  prod-diff:
    name: Prod diff (read-only)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Real values, so unchanged secret env vars don't show as changes; the output is redacted below.
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      ENVIRONMENT: grantwell-staging

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PROD_DIFF_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-grantwell-prod-diff
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/ui/package-lock.json
            instances/generic/package-lock.json

      - name: Build Generic from source (build/generic)
        run: scripts/pack.sh --dev

      # Output is printed and kept even when cdk diff fails, so the error is visible.
      - name: Diff against live prod
        id: diff
        working-directory: build/generic
        shell: bash
        run: |
          set -o pipefail
          status=0
          npx cdk diff --method template --no-color 2>&1 |
            node -e '
              let text = require("fs").readFileSync(0, "utf8");
              for (const key of ["GRANTS_GOV_API_KEY", "TURNSTILE_SECRET_KEY", "TURNSTILE_SITE_KEY"]) {
                const value = process.env[key];
                if (value) text = text.split(value).join(`<${key}>`);
              }
              process.stdout.write(text);
            ' > "$RUNNER_TEMP/prod-diff.txt" || status=$?
          cat "$RUNNER_TEMP/prod-diff.txt"
          exit $status

      # The full diff can pass the 1 MiB summary limit, so the summary lists stacks and resources only.
      - name: Summarize
        if: always() && steps.diff.outcome != 'skipped'
        env:
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
        run: |
          {
            echo "## Prod diff: live grantwell-staging vs this commit"
            echo
            if [ "$DIFF_OUTCOME" != success ]; then
              echo "cdk diff failed. Last 60 lines of its output:"
              echo
              echo '```'
              tail -n 60 "$RUNNER_TEMP/prod-diff.txt"
              echo '```'
            else
              echo "Stacks and resource-level changes. Full redacted diff: artifact \`prod-diff\`."
              echo
              echo '```'
              grep -E '^(Stack |\[[-+~]\] |✨)' "$RUNNER_TEMP/prod-diff.txt" | head -c 900000
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prod diff
        if: always() && steps.diff.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: prod-diff
          path: ${{ runner.temp }}/prod-diff.txt
          if-no-files-found: error
