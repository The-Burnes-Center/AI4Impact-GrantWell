name: Deploy

# Checks every push and pull request; deploys only when run by hand (Actions > Deploy > Run workflow).
# Until vendor/ is committed (a repo just made from the template), the check runs scripts/install.sh
# instead, so you can see whether your config installs and synths; it commits nothing.
#
# Each deployment in config/instances.ts needs a GitHub Environment named after its aws.environment
# (Settings > Environments), holding:
#   secrets    AWS_ROLE_ARN          IAM role this workflow assumes through GitHub OIDC
#              GRANTS_GOV_API_KEY
#              TURNSTILE_SECRET_KEY  only when auth.turnstile is on (the default)
#              TURNSTILE_SITE_KEY
#   variables  AWS_REGION            region the deployment lives in
# Add required reviewers to an Environment to make its deploys wait for approval.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: Deployment to deploy (its aws.environment)
        type: choice
        # One entry per deployment in config/instances.ts.
        options:
          - grantwell-example-staging
          - grantwell-example

permissions:
  contents: read

jobs:
  check:
    name: Check vendor/, config and templates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Is a release installed?
        id: installed
        run: |
          if ls vendor/grantwell-*.tgz >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "::error::Nothing to deploy yet: run scripts/install.sh, then commit vendor/, package.json and package-lock.json."
            exit 1
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: vendor/ matches the lockfile
        if: steps.installed.outputs.value == 'true'
        run: node scripts/check-vendor.mjs

      - name: Install from vendor/
        if: steps.installed.outputs.value == 'true'
        run: npm ci

      - name: Typecheck config
        if: steps.installed.outputs.value == 'true'
        run: npm run typecheck

      - name: Generate templates for every deployment
        if: steps.installed.outputs.value == 'true'
        run: node scripts/synth.mjs synth cdk.out/check

      - name: Trial install (nothing committed)
        if: steps.installed.outputs.value == 'false'
        run: |
          scripts/install.sh
          echo "::notice::Install and synth passed. Run scripts/install.sh yourself and commit vendor/, package.json and package-lock.json before deploying."

  deploy:
    name: Deploy ${{ inputs.deployment }}
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.deployment }}
    concurrency:
      group: deploy-${{ inputs.deployment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      ENVIRONMENT: ${{ inputs.deployment }}
      GRANTS_GOV_API_KEY: ${{ secrets.GRANTS_GOV_API_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: vendor/ matches the lockfile
        run: node scripts/check-vendor.mjs

      - name: Install from vendor/
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ github.actor }}-grantwell-deploy
          aws-region: ${{ vars.AWS_REGION }}

      # ENVIRONMENT selects one deployment, so --all is that deployment's stacks only.
      - name: Deploy
        run: npx cdk deploy --all --require-approval never
